<!doctype html>
<meta charset="utf-8">
<title>Open in Claude</title>
<p>Opening Claude… <a id="l">Click here if nothing happens.</a></p>
<script>
const id = location.hash.slice(1);
if (/^local_[0-9a-f-]+$/.test(id)) {
  const url = "claude://claude.ai/epitaxy/" + id;
  document.getElementById("l").href = url;
  location.href = url;
}
</script>
