<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open in Claude</title>
<style>body{font:16px system-ui,sans-serif;margin:3em 16px;color:#ddd;background:#1f1f1f}a{color:#9ab}</style>
<p id="m">Opening Claude…</p>
<script>
const id = location.hash.slice(1);
const m = document.getElementById("m");
const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
if (mobile) {
  const url = "https://claude.ai/code";
  m.innerHTML = 'Opening the Claude app… Look for the session starting with ⏸. <a href="' + url + '">Open Claude</a>';
  location.href = url;
} else if (/^local_[0-9a-f-]+$/.test(id)) {
  const url = "claude://claude.ai/epitaxy/" + id;
  location.href = url;
  setTimeout(() => {
    m.innerHTML = 'Opened in Claude. You can close this tab (⌘W). <a href="' + url + '">Open again</a>';
  }, 1000);
} else {
  m.textContent = "No Claude session in this link.";
}
</script>
